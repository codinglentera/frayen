<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Kontrol HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Aplikasi Media Sederhana</h1>
    </header>
    
    <main>
        <section class="media-container">
            <h2>Gambar (Input Statis & Kontrol JS)</h2>
            <img id="media-image" src="gambar1.jpg" alt="Gambar Awal" class="media-display">
            <p>Klik tombol di bawah untuk mengganti gambar.</p>
            <button id="change-img-btn" class="control-btn primary-btn">Ganti Gambar</button>
        </section>

        <hr>

        <section class="media-container">
            <h2>Video (Input HTML & Kontrol JS)</h2>
            <video id="media-video" poster="thumbnail.jpg" class="media-display">
                <source src="video-anda.mp4" type="video/mp4">
                Maaf, browser Anda tidak mendukung elemen video.
            </video>
            
            <div class="controls-group">
                <button id="play-btn" class="control-btn success-btn">▶️ Putar</button>
                <button id="pause-btn" class="control-btn warning-btn">⏸️ Jeda</button>
                <button id="reset-btn" class="control-btn danger-btn">⏮️ Kembali ke Awal</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
